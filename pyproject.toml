[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conduit-forge"
version = "0.2.0"
description = "Turn a website or Windows app into an evidence-backed MCP connector."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "playwright>=1.51,<2",
  "jsonschema>=4.23,<5", "pyyaml>=6,<7",
  "mini-racer>=0.14.1,<0.15",
  "pywin32>=310; sys_platform == 'win32'", "python-dotenv>=1,<2",
  "anthropic>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
conduit = "conduit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["conduit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: launches a real browser or MCP subprocess", "desktop: requires an interactive Windows desktop", "live_model: uses the configured live model and account usage", "sign_in_check: runs Seira's real sign-in check instead of the signed-in default"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".conduit", ".cache", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
